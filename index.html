<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOSQO — Boško Kosić</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Background canvases -->
  <canvas id="stars"></canvas>
  <canvas id="stardrops"></canvas>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="#work" class="nav-link nav-work">WORK</a>
      <div class="nav-logo-wrap">
        <a href="/" class="nav-logo">
          <img src="assets/logo.svg" alt="BOSQO" />
        </a>
        <svg class="nav-frame" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop id="navGradStop1" offset="0%" stop-color="#0D0D0F"/>
            <stop id="navGradStop2" offset="100%" stop-color="#1de9b6"/>
          </linearGradient>
        </defs>
        <rect class="nf-rect" x="1" y="1" rx="55" ry="55" stroke-dashoffset="5000" stroke-dasharray="5000"/>
      </svg>
      </div>
      <a href="#contact" class="nav-link nav-contact">CONTACT</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <!-- Avatar -->
      <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <div class="avatar-ring"></div>
        <div class="avatar">
          <img src="assets/ilustracija.svg" alt="Boško Kosić" />
        </div>
        <div class="avatar-border"></div>
        <div class="avatar-outer-ring"></div>
      </div>
    </div>
  </section>

  <!-- Scroll hint -->
  <div class="scroll-hint" id="scrollHint">
    <div class="scroll-mouse">
      <div class="scroll-wheel"></div>
    </div>
    <span class="scroll-label">SCROLL TO CONTINUE</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
