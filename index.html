<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOSQO — Boško Kosić</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <!-- Particle canvas -->
  <canvas id="particles"></canvas>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-logo">BOSQO</div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">

      <!-- Avatar -->
      <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <div class="avatar-ring"></div>
        <div class="avatar">
          <img src="assets/ilustracija.svg" alt="Boško Kosić" />
        </div>
      </div>

      <!-- Text Content -->
      <h1 class="hero-name">Boško Kosić</h1>
      <p class="hero-title">AI-Powered Multidisciplinary Designer</p>
      <p class="hero-description">Creating high-impact visuals through motion, branding, and digital storytelling.</p>
      <p class="hero-credibility">5+ years experience &bull; Teaching Assistant</p>
    </div>

    <!-- Bottom UI -->
    <div class="hero-bottom">
      <!-- Progress dots -->
      <div class="progress-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <!-- Scroll hint -->
      <div class="scroll-hint">
        <div class="scroll-line"></div>
        <span>Scroll to continue</span>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
