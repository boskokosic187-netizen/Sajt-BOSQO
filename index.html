<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOSQO — Boško Kosić</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Background canvases -->
  <canvas id="stars"></canvas>
  <canvas id="stardrops"></canvas>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="nav-logo">
      <img src="assets/logo.svg" alt="BOSQO" />
    </a>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <!-- Avatar -->
      <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <div class="avatar-ring"></div>
        <div class="avatar">
          <img src="assets/ilustracija.svg" alt="Boško Kosić" />
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
