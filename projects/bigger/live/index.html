<style>
@font-face{font-family:Chubbo;src:url(fonts/Chubbo-Bold.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:Satoshi;src:url(fonts/Satoshi-Medium.woff2) format("woff2");font-weight:500;font-display:block}
:root{--paper:#F4EEE3;--ink:#17161C;--pink:#FF4F8B;--pinkdk:#D93A72;--mute:#17161C99}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font:500 15px/1.4 Satoshi;-webkit-font-smoothing:antialiased}
.stage{position:relative;height:100%;display:flex;flex-direction:column;padding:clamp(14px,2.4vh,26px) clamp(16px,3vw,40px) clamp(16px,3vh,30px)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.wm{height:clamp(22px,3.4vh,34px);width:auto;display:block}
.kick{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-align:right}
#scene{flex:1;min-height:0;width:100%;display:block;margin:clamp(8px,1.6vh,16px) 0}
.ctl{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.btn{font:700 clamp(20px,2.6vh,26px)/1 Chubbo;color:#fff;background:var(--pink);border:0;border-radius:999px;padding:.72em 1.25em .78em 1.05em;
  display:inline-flex;align-items:center;gap:.55em;cursor:pointer;box-shadow:0 .2em 0 var(--pinkdk),0 .6em 1.4em #FF4F8B47;transition:transform .08s,box-shadow .08s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(.14em) scale(.97);box-shadow:0 .06em 0 var(--pinkdk),0 .3em .8em #FF4F8B40}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.btn i{width:.42em;height:.42em;border-radius:50%;background:#fff;display:block}
.hint{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#live{position:absolute;left:-9999px}
#stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-11deg) scale(2.4);opacity:0;pointer-events:none;
  font:700 clamp(40px,9vh,92px)/1 Chubbo;color:var(--pink);border:.09em solid var(--pink);border-radius:.18em;padding:.08em .32em .14em;
  background:#F4EEE3d9;mix-blend-mode:multiply}
#stamp.on{opacity:.94;transform:translate(-50%,-50%) rotate(-11deg) scale(1);transition:transform .22s cubic-bezier(.2,1.6,.4,1),opacity .1s}
.lite #stamp.on{transition:none}
.ready #scene{opacity:1}
@media (max-width:560px){.kick{display:none}.hint{display:none}}
</style>
</head>
