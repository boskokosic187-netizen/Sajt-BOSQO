<style>
@font-face{font-family:Syn;src:url(fonts/Synonym-Regular.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:SentLI;src:url(fonts/Sentient-LightItalic.woff2) format("woff2");font-style:italic;font-display:swap}
:root{--ice:#E8EEF6;--steel:#8E9AAE;--mute:#8E9AAEb3;--red:#FF3D2E;--night:#05070D;--st:.6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ice);overflow:hidden;font:500 15px/1.4 Syn,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
#cv,.poster{position:absolute;inset:0;width:100%;height:100%;display:block}
.poster{object-fit:cover}
#cv{opacity:0;transition:opacity .4s}
.ready #cv{opacity:1}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000038 2px 3px);opacity:calc(var(--st) * .9);mix-blend-mode:multiply}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,#0000 55%,#05070D99 100%),
  linear-gradient(#05070Dcc,#05070D00 clamp(70px,12vh,120px)),linear-gradient(0deg,#05070De6,#05070D00 clamp(170px,30vh,260px))}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(14px,2.6vh,26px) clamp(16px,3vw,40px)}
.wm{height:clamp(14px,2.3vw,24px);width:auto;display:block;overflow:visible}
.wm .l{transition:fill .15s}
.onair .wm .l{filter:drop-shadow(0 0 6px #FF3D2Ecc)}
.kick{margin:0 auto 0 18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.snd{font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel);background:none;border:1px solid #8E9AAE55;border-radius:999px;padding:.55em 1em;cursor:pointer;display:flex;gap:.6em;align-items:center}
.snd i{width:7px;height:7px;border-radius:50%;background:#5E6B80}
.snd[aria-pressed=true] i{background:var(--red);box-shadow:0 0 8px var(--red)}
.snd:focus-visible,.dial:focus-visible,.again:focus-visible,.run:focus-visible{outline:2px solid var(--ice);outline-offset:4px}
.tuner{position:absolute;left:50%;bottom:clamp(14px,3.4vh,34px);transform:translateX(-50%);width:min(880px,92vw);display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .8s}
.read{display:flex;align-items:baseline;gap:.5em;font-variant-numeric:tabular-nums}
.f{font-size:clamp(30px,4.6vw,46px);letter-spacing:.04em;line-height:1;min-width:3.4ch;text-align:right}
.u{font-size:12px;letter-spacing:.24em;color:var(--steel)}
.meter{display:flex;gap:3px;align-items:flex-end;margin-left:.6em;height:16px}
.meter i{width:4px;background:var(--ice);opacity:.18;border-radius:1px}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:8px}.meter i:nth-child(3){height:11px}.meter i:nth-child(4){height:14px}.meter i:nth-child(5){height:16px}
.meter i.lit{opacity:.95}
.locked .meter i{background:var(--red);opacity:1}
.dial{position:relative;width:100%;height:58px;overflow:hidden;cursor:grab;touch-action:none;
  -webkit-mask-image:linear-gradient(90deg,#0000,#000 18%,#000 82%,#0000);mask-image:linear-gradient(90deg,#0000,#000 18%,#000 82%,#0000)}
.dial.held{cursor:grabbing}
.scale{position:absolute;left:0;top:0;will-change:transform}
.needle{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--red);box-shadow:0 0 10px #FF3D2Eaa}
.hint{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.locked .hint{opacity:0}
.end .tuner{opacity:0;pointer-events:none}
.sub{position:absolute;left:50%;bottom:calc(clamp(14px,3.4vh,34px) + 150px);transform:translateX(-50%);margin:0;max-width:86vw;text-align:center;
  font-size:clamp(18px,2.2vw,26px);color:#fff;text-shadow:0 2px 10px #000c;opacity:0;transition:opacity .25s}
.sub.on{opacity:1}
.sub.radio::before{content:"";display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);margin-right:.55em;vertical-align:.18em}
.tag{position:absolute;left:0;right:0;top:50%;margin:0;text-align:center;font:italic 300 clamp(22px,3vw,38px)/1.2 SentLI,Georgia,serif;letter-spacing:.02em;color:#D5DDE8;
  opacity:0;transform:translateY(-50%);transition:opacity 1.2s .6s;text-shadow:0 2px 18px #000}
.end .tag{opacity:1}
.again,.run{position:absolute;left:50%;transform:translateX(-50%);font:inherit;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ice);
  background:#05070Dcc;border:1px solid #E8EEF655;border-radius:999px;padding:.9em 1.6em;cursor:pointer}
.again{top:calc(50% + 56px)}
.run{top:50%;display:flex;gap:.7em;align-items:center}
.run i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
[hidden]{display:none!important}
@media (max-width:640px){.kick{display:none}.sub{bottom:calc(clamp(14px,3.4vh,34px) + 140px)}}
@media (prefers-reduced-motion:reduce){#cv,.tuner,.tag,.sub{transition:none}}
</style>
</head>
