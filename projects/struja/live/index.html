<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СТРУЈА — live identity</title>
<meta name="description" content="STRUJA, a living identity for a Belgrade river festival: one line of light, driven by music. Concept and design by Boško Kosić.">
<link rel="preload" href="data/glyphs.bin" as="fetch" crossorigin>
<style>
@font-face { font-family: "SG UI"; src: url(fonts/sg-ui.woff) format("woff"); font-display: swap; }
:root { --ink: #0b0907; --paper: #ede6da; --sodium: #ff7a1a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
#struja { position: fixed; inset: 0; color: var(--paper); font: 11px/1 "SG UI", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
#struja canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .35s ease-out; }
#struja.is-live canvas { opacity: 1; }
#struja .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .6s ease-out; }
#struja.is-live .poster { opacity: 0; pointer-events: none; }
.tag { position: absolute; left: clamp(16px, 3vw, 32px); top: clamp(16px, 3vw, 28px); opacity: .85; }
.tag b { font-weight: inherit; color: var(--sodium); }
.hint { position: absolute; right: clamp(16px, 3vw, 32px); bottom: clamp(22px, 3.4vw, 36px); opacity: .55; text-align: right; }
.ctrl { position: absolute; left: clamp(16px, 3vw, 32px); bottom: clamp(16px, 3vw, 28px); display: flex; gap: 10px; }
.ctrl button { appearance: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--paper); min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(237,230,218,.32); background: rgba(11,9,7,.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: pointer; display: inline-flex; align-items: center; gap: 10px; transition: border-color .2s ease-out, background-color .2s ease-out; }
.ctrl button:hover { border-color: rgba(237,230,218,.7); }
.ctrl button:focus-visible { outline: 2px solid var(--sodium); outline-offset: 3px; }
.ctrl button[aria-pressed="true"] { border-color: var(--sodium); background: rgba(255,122,26,.14); }
.ctrl button:disabled { opacity: .35; cursor: default; }
.ctrl i { width: 8px; height: 8px; border-radius: 50%; background: var(--sodium); box-shadow: 0 0 10px var(--sodium); font-style: normal; }
[data-play] .on, [data-play][aria-pressed="true"] .off { display: none; }
[data-play][aria-pressed="true"] .on { display: inline; }
.is-loading [data-play] { opacity: .6; }
.is-static .ctrl, .is-static .hint { display: none; }
@media (hover: none) { .hint .mouse { display: none; } }
@media (hover: hover) { .hint .touch { display: none; } }
.ctrl .s { display: none; }
@media (max-width: 520px) { .hint { display: none; } .ctrl button { padding: 0 16px; } .ctrl .l { display: none; } .ctrl .s { display: inline; } }
</style>
</head>
<body>
<div id="struja" data-mode="idle" data-base="">
  <picture><source media="(orientation: portrait)" srcset="media/poster-v.webp" width="900" height="1600"><img class="poster" src="media/poster.webp" alt="STRUJA wordmark cut by a line of sodium light over the river at night" width="1600" height="900" decoding="async"></picture>
  <canvas aria-label="STRUJA live identity: a line of light that reacts to music, microphone and cursor"></canvas>
  <div class="tag">СТРУЈА <b>·</b> live identity</div>
  <div class="ctrl">
    <button type="button" data-play aria-pressed="false"><i aria-hidden="true"></i><span class="off"><span class="l">Play the track</span><span class="s">Play</span></span><span class="on">Pause</span></button>
    <button type="button" data-mic aria-pressed="false" aria-label="Listen to the room (microphone)"><span class="l">Listen to the room</span><span class="s">Mic</span></button>
  </div>
  <div class="hint"><span class="mouse">Move the cursor — the current follows</span><span class="touch">Drag — the current follows</span></div>
</div>
<script src="struja.js" defer></script>
<script src="timeline.js" defer></script>
<script src="live.js" defer></script>
</body>
</html>
