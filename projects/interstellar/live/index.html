<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INTERSTELLAR · Bend the light</title>
<meta name="description" content="Unofficial fan poster. Drag the black hole across the GARGANTUA poster: the stars and the title bend live, and Earth time races as it nears the astronaut.">
<style>
@font-face{font-family:"Martian Mono";src:url(fonts/martian-mono.woff) format("woff");font-weight:420;font-display:block}
@font-face{font-family:"Anybody Wide";src:url(fonts/anybody-wide.woff) format("woff");font-weight:600;font-display:block}
:root{--void:#050507;--gold:#F0A646;--dust:#CBBFA8;--bone:#ECE4D4;--ash:#6E6A62;--mono:"Martian Mono";--wide:"Anybody Wide"}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--void);color:var(--bone);overflow:hidden;
font:420 11px/1.45 var(--mono);-webkit-font-smoothing:antialiased;letter-spacing:.04em;font-variant-numeric:tabular-nums}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;opacity:0;transition:opacity .6s}
body.ready canvas{opacity:1}body.drag canvas{cursor:grabbing}
.poster{position:fixed;inset:0;background:var(--void) center/contain no-repeat}
body.lite .poster{background-image:url(media/poster-wide.webp)}
@media (max-aspect-ratio:4/5){body.lite .poster{background-image:url(media/poster.webp)}}
#hud{position:fixed;left:18px;top:16px;pointer-events:none;display:grid;grid-template-columns:auto auto;gap:3px 14px;align-items:baseline;text-shadow:0 1px 2px #000}
#hud dt{color:var(--dust);font:600 9px/1.6 var(--wide);letter-spacing:.22em}
#hud dd{margin:0;font-size:15px;font-variant-numeric:tabular-nums;color:var(--bone)}
#hud dd.earth{color:var(--gold)}
#hud .k{grid-column:1/3;color:var(--ash);font-size:10px;margin-top:4px;font-variant-numeric:tabular-nums}
#hud .k b{color:var(--dust);font-weight:420}
body.far #hud .k b.f{color:var(--dust)}body.near #hud .k b.f{color:var(--gold)}
#hint{position:fixed;left:18px;right:18px;bottom:14px;color:var(--dust);font-size:11px;pointer-events:none;text-shadow:0 1px 2px #000;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#hint span:last-child{color:var(--ash);font:600 9px/1.6 var(--wide);letter-spacing:.22em;text-transform:uppercase}
#hud sub,#hud sup{font-size:.75em;line-height:0}
#run{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);display:none;font:600 12px/1 var(--wide);letter-spacing:.24em;color:var(--void);background:var(--gold);border:0;padding:11px 18px;cursor:pointer}
#run:focus-visible,canvas:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
body.lite #run{display:block}body.lite canvas,body.lite #hud{display:none}
body.lite #hint span:first-child{visibility:hidden}
@media (max-width:520px){#hud dd{font-size:13px}#hint{font-size:10px}}
@media (prefers-reduced-motion:reduce){canvas{transition:none}}
</style></head>
<body>
<div class="poster" aria-hidden="true"></div>
<canvas id="c" tabindex="0" aria-label="GARGANTUA fan poster. Drag the black hole; arrow keys move it, Escape puts it back."></canvas>
<dl id="hud" aria-live="off">
  <dt>SHIP TIME</dt><dd id="ship">00:00:00</dd>
  <dt>EARTH TIME</dt><dd id="earth" class="earth">00:00:00</dd>
  <div class="k">r = <b id="r">—</b> r<sub>s</sub><br>1 s here = <b id="f" class="f">1.000 s</b> on Earth<br>Earth runs (1 − r<sub>s</sub>/r)<sup>−½</sup> × faster</div>
</dl>
<div id="hint"><span>Drag the black hole. Bring it close to the astronaut.</span><span>INTERSTELLAR · unofficial fan poster</span></div>
<button id="run" type="button">RUN IT LIVE</button>
<noscript><style>.poster{background-image:url(media/poster.webp)}#hud,#hint{display:none}</style></noscript>
<script src="live.js"></script>
</body></html>
