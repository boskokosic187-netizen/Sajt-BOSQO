    html, body { height: 100%; margin: 0; }

    main { width: min(100%, 720px); }
    .tally { display: inline-flex; align-items: center; gap: 10px; padding: 7px 12px; border: 1px solid rgba(242, 239, 234, 0.24); border-radius: 999px; color: #8f8c86; font-stretch: 80%; font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }

    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    a { display: inline-flex; align-items: center; height: 52px; padding: 0 24px; border-radius: 999px; border: 1px solid rgba(242, 239, 234, 0.24); color: inherit; font-weight: 700; text-decoration: none; transition: border-color 0.2s, background 0.2s; }
    a:hover, a:focus-visible { border-color: #f2efea; }
    a.go { border-color: #ff4d1f; background: #ff4d1f; color: #0a0a0b; }
    a.go:hover, a.go:focus-visible { background: #ff6a42; border-color: #ff6a42; }
    a:focus-visible { outline: 2px solid #66eed8; outline-offset: 3px; }
